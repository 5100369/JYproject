name: Build VideoMatrix Installer (macOS)

# Self-contained macOS .dmg for the Electron + FastAPI + ffmpeg architecture.
# Same recipe as the Windows workflow, only the platform-specific binaries
# differ. Users mount the dmg and drag-drop into Applications — no Python
# or Homebrew needed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the dmg to"
        required: true
        default: "v2.8.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python toolchain ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      # ── Bundle macOS FFmpeg / FFprobe ───────────────────────────────────
      - name: Restore verified macOS media tools
        id: media-tools
        uses: actions/cache@v4
        with:
          path: backend/ffmpeg
          key: macos-evermeet-9.0.2-from-v2.7.0-v1

      # Reuse the same Evermeet 9.0.2 tools from our verified release. This
      # avoids the upstream mirror's persistent 429 responses on CI runners.
      # Only the two media tools are extracted; no old application code is used.
      - name: Prepare verified FFmpeg static build
        if: steps.media-tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/ffmpeg
          tools_dir="$RUNNER_TEMP/videomatrix-media-tools"
          mkdir -p "$tools_dir"
          for attempt in 1 2 3; do
            if gh release download v2.7.0 --repo "$GITHUB_REPOSITORY" \
              --pattern VideoMatrix.Setup.2.7.0-mac.dmg --dir "$tools_dir" --clobber; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          dmg="$tools_dir/VideoMatrix.Setup.2.7.0-mac.dmg"
          echo "be276ec7c6368a1b92cad5fea3fb1924b8f3849044030df1b2ecdde303d2b3aa  $dmg" | shasum -a 256 -c -
          mount_dir="$tools_dir/mounted"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          python - "$mount_dir/VideoMatrix.app/Contents/Resources/backend/videomatrix-backend" <<'PY'
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          import sys
          archive = CArchiveReader(sys.argv[1])
          for tool in ("ffmpeg", "ffprobe"):
              Path("backend/ffmpeg", tool).write_bytes(archive.extract(tool))
          PY

      - name: Verify macOS media tools
        run: |
          chmod +x backend/ffmpeg/ffmpeg backend/ffmpeg/ffprobe
          for tool in ffmpeg ffprobe; do
            version=$("backend/ffmpeg/$tool" -version | sed -n '1p')
            echo "$version"
            # Evermeet appends its publisher suffix (for example -tessus).
            echo "$version" | grep -E "^$tool version 9\\.0\\.2([- ]|$)"
          done

      - name: Test backend regressions
        working-directory: backend
        run: python -m pytest tests/test_bgm_tracks.py tests/test_audio_duration.py tests/test_runtime_startup.py tests/test_variant_task_service.py tests/test_task_resume.py tests/test_full_hook.py tests/test_grouped_body_and_cover.py tests/test_subtitle.py tests/test_video_variant.py tests/test_benchmark_session.py tests/test_ffmpeg_diagnostics.py tests/test_hardware_recovery.py tests/test_dedup_plan.py tests/test_dedup_renderer.py tests/test_dedup_integration.py tests/test_dedup_blend_eof.py tests/test_random_output.py tests/test_random_output_hardware.py tests/test_source_framing.py tests/test_framing_preview.py tests/test_fused_cover.py -q

      - name: Test updater activity gate
        working-directory: backend
        run: python -m pytest tests/test_update_activity.py -q

      # ── Backend → single self-contained binary ───────────────────────────
      - name: Build backend binary
        working-directory: backend
        run: pyinstaller --clean videomatrix-backend.spec

      - name: Verify packaged backend identity and shutdown
        working-directory: backend
        run: VIDEOMATRIX_TEST_BINARY="$PWD/dist/videomatrix-backend" python -m pytest tests/test_runtime_startup.py -q

      # ── Node toolchain ───────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build renderer / main / preload
        working-directory: frontend
        run: |
          node --test tests/runtime.test.cjs tests/updates.test.cjs
          npm run build

      # ── Package as .dmg (extraResources pulls backend exe in automatically)
      - name: Generate macOS icon
        working-directory: frontend
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16     public/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32     public/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     public/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64     public/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   public/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256   public/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   public/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512   public/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   public/icon.png --out build/icon.iconset/icon_512x512.png
          sips -z 1024 1024 public/icon.png --out build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Package Electron app
        working-directory: frontend
        env:
          # skip code signing in CI — release will be ad-hoc signed
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoMatrix-mac-dmg
          path: frontend/release/*.dmg

      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --title "VideoMatrix ${tag#v}" \
              --notes "Self-contained macOS dmg (Electron + FastAPI + ffmpeg, no Python required)."
          fi
          dmg=$(ls frontend/release/*.dmg | head -1)
          version=$(node -p "require('./frontend/package.json').version")
          upload_path="$(dirname "$dmg")/VideoMatrix.Setup.${version}-mac.dmg"
          cp "$dmg" "$upload_path"
          gh release upload "$tag" "$upload_path" --repo "$GITHUB_REPOSITORY" --clobber
